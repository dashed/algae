[package]
name = "algae-macros"
version = "0.2.0"
description = "Procedural macros for the algae algebraic effects library"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[features]
default = []

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"