[package]
name = "algae"
version = "0.1.0"
description = "One-shot algebraic effects and handlers for Rust, built on nightly coroutines"
readme = "../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["macros"]
macros = ["algae-macros"]

[dependencies]
algae-macros = { path = "../algae-macros", optional = true }

[dev-dependencies]
trybuild = "1"

# Examples that require macros
[[example]]
name = "console"
required-features = ["macros"]

[[example]]
name = "debug"
required-features = ["macros"]

[[example]]
name = "effect_test"
required-features = ["macros"]

[[example]]
name = "pure"
required-features = ["macros"]

[[example]]
name = "advanced"
required-features = ["macros"]

[[example]]
name = "overview"
required-features = ["macros"]

[[example]]
name = "readme"
required-features = ["macros"]

[[example]]
name = "theory"
required-features = ["macros"]

[[example]]
name = "minimal"
required-features = ["macros"]

[[example]]
name = "explicit_vs_convenient"
required-features = ["macros"]

[[example]]
name = "multiple_effects_demo"
required-features = ["macros"]

[[example]]
name = "custom_root_effects"
required-features = ["macros"]

[[example]]
name = "test_error_messages"
required-features = ["macros"]

[[example]]
name = "partial_handlers"
required-features = ["macros"]

[[example]]
name = "variable_handler_chain"
required-features = ["macros"]

[[example]]
name = "chained_handlers"
required-features = ["macros"]

[[example]]
name = "clean_chaining"
required-features = ["macros"]

[[example]]
name = "vec_handler_flattening_demo"
required-features = ["macros"]

# `no_macros` deliberately has no stanza: it must keep building with
# `--no-default-features`.
